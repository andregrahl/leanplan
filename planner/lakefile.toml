name = "lean-planner"
version = "0.1.0"
defaultTargets = ["Planner", "planner"]

# mathlib is required by the `Proofs` library only.  Nothing under `Planner/` or
# `Main.lean` imports it, so the executable builds without touching mathlib.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.30.0"

# The planner itself: Lean core + Batteries (via mathlib's transitive dependency)
# are the only libraries in scope.
[[lean_lib]]
name = "Planner"

# The proofs about the planner.  Separate library, separate files, same names.
[[lean_lib]]
name = "Proofs"

[[lean_exe]]
name = "planner"
root = "Main"
supportInterpreter = false

[[lean_exe]]
name = "domain_schema_gen"
root = "DomainSchemaGen"
supportInterpreter = false
